# ═══════════════════════════════════════════════════════════════
#                   Configuration de la timeline TrendRadar
#                      Version: 1.2.0
# ═══════════════════════════════════════════════════════════════
#
# Ce fichier contrôle « quoi faire et à quel moment ».
#
# La plupart des utilisateurs n'ont pas besoin d'éditer ce fichier.
# Il suffit de choisir un modèle prédéfini dans config.yaml :
#
#   schedule:
#     preset: "morning_evening"    ← il suffit de modifier ceci
#
#
# Adresse de l'éditeur de configuration visuel : https://sansan0.github.io/TrendRadar/
#
#
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
# 📖 Concepts de base (pour vous aider à comprendre la configuration qui suit)
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
#
#
# 🔁 Comment le programme fonctionne-t-il ?
#
#   TrendRadar ne tourne pas en permanence en arrière-plan : il est réveillé
#   périodiquement par un « réveil programmé » :
#
#     Utilisateurs GitHub Actions → déclenchés par le cron défini dans .github/workflows/crawler.yml
#                           par défaut, exécution toutes les heures (par ex. à la 33e minute de chaque heure)
#
#     Utilisateurs Docker         → déclenchés par CRON_SCHEDULE défini dans docker/.env
#                           par défaut, exécution toutes les 30 minutes
#
#   À chaque réveil, le programme exécute successivement les trois phases suivantes :
#
#     1️⃣ Collecte (collect)
#        Récupère les dernières données des plateformes de palmarès + des sources RSS, puis les stocke en base
#
#                  ⬇
#
#     2️⃣ Analyse (analyze)
#        Fait appel à un grand modèle IA pour une analyse approfondie des actualités collectées (optionnel, nécessite une clé API)
#
#                  ⬇
#
#     3️⃣ Notification (push)
#        Envoie les actualités phares organisées + les résultats de l'analyse IA vers vos canaux de notification
#        (Feishu, DingTalk, Telegram, e-mail, etc.)
#
#   Ces trois phases peuvent être activées/désactivées indépendamment. Le rôle de ce fichier est de contrôler :
#   « pour chaque plage horaire, quelles phases activer/désactiver ».
#
#
# 🔌 Relation entre les interrupteurs généraux de config.yaml et les interrupteurs de plage horaire de la timeline
#
#   config.yaml contient plusieurs « interrupteurs généraux » dont la priorité est supérieure à celle de ce fichier :
#
#     platforms.enabled: false   → ne jamais crawler les palmarès (quelle que soit la configuration de la timeline)
#     rss.enabled: false         → ne jamais crawler le RSS (idem)
#     notification.enabled: false → ne jamais notifier (idem)
#     ai_analysis.enabled: false  → ne jamais analyser (idem)
#
#   Les interrupteurs de plage horaire de la timeline ne prennent effet que si l'interrupteur général est à true.
#   Autrement dit : l'interrupteur général décide « si l'on peut le faire », la timeline décide « quand le faire ».
#
#
# ⏰ Qu'est-ce qu'une « plage horaire » et une « période de silence » ?
#
#   Vous pouvez imaginer une journée comme une ligne de temps, divisée en plusieurs « plages horaires ».
#   Chaque plage horaire a ses propres interrupteurs de comportement (collecte ou non, analyse ou non, notification ou non).
#
#   Le temps qui n'appartient à aucune plage horaire s'appelle la « période de silence » (elle suit la configuration par défaut « default »).
#   La période de silence doit généralement collecter, afin que les données s'accumulent en continu,
#   et qu'au moment de la notification, un rapport complet puisse être synthétisé.
#
#
#   💡 Plus la période de silence est longue, plus les données accumulées sont riches (trajectoire des changements de classement, heures d'entrée/sortie du palmarès, etc.),
#   et plus le contexte finalement soumis à l'analyse IA est complet, ce qui améliore la qualité de l'analyse.
#   Par rapport à un serveur MCP, cette approche permet, grâce aux données de toute la journée, de présenter une tendance de popularité et une dynamique de changement plus complètes.
#
#
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
# 📋 Aperçu des modèles prédéfinis (il suffit d'en choisir un)
# ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─ ─
#
#   1️⃣ always_on        En continu, notification dès qu'il y a une nouveauté (par défaut)
#   2️⃣ morning_evening  Notification toute la journée + synthèse du soir (recommandé pour la plupart des gens)
#   3️⃣ office_hours     Trois temps en jours ouvrés : aperçu à l'arrivée → actualités de midi → synthèse en fin de journée
#   4️⃣ night_owl        Aperçu de l'après-midi + synthèse de toute la journée tard le soir
#   5️⃣ custom           Entièrement personnalisable (nécessite d'éditer la section custom en bas de ce fichier)
#
# Envie de personnaliser ? Deux possibilités :
#   1. Allez directement à la partie « Mode personnalisé » en bas de ce fichier
#   2. Ajoutez votre propre modèle prédéfini dans presets ci-dessous
#      (il suffit que la clé ne soit pas en double, puis indiquez le nom de votre modèle dans config.yaml)
#
# ⚠️ Conseils concernant la conception des plages horaires :
#   GitHub Actions : il est recommandé d'espacer les tâches planifiées d'au moins 2 heures. Comme le déclenchement par le système comporte un délai aléatoire, un intervalle trop court peut faire manquer l'exécution d'une tâche.
#   Utilisateurs Docker : le cron est ponctuel, sans cette contrainte ; réglez-le selon vos besoins.
#
#
# ═══════════════════════════════════════════════════════════════


# ───────────────────────────────────────────────────────────────
# Modèles prédéfinis
# ───────────────────────────────────────────────────────────────
presets:

  # ───────────────────────────────────────────────────────────
  # 1️⃣ always_on - Surveillance en continu
  #
  # Le mode le plus simple : collecte + notification en continu, vous êtes notifié dès qu'il y a une nouveauté.
  # Aucune plage horaire n'est définie, la même configuration est utilisée toute la journée.
  # Convient à : utilisateurs intensifs, surveillance en temps réel de l'opinion
  #
  # Toute la journée : notification ✓ | analyse IA ✗ | nombre de notifications illimité
  # ───────────────────────────────────────────────────────────
  always_on:
    name: "Surveillance permanente"
    description: "Surveillance en continu, notification immédiate dès qu'il y a une nouveauté. Convient aux utilisateurs intensifs."

    # Configuration par défaut ── ce jeu d'interrupteurs est utilisé en dehors de toute plage horaire
    # Comme ce mode ne définit aucune plage horaire, default correspond au comportement de toute la journée
    default:
      collect: true                # Collecter les données (crawler les palmarès + RSS)
      analyze: false               # Pas d'analyse IA (pour économiser les frais d'API)
      ai_mode: "current"           # L'IA analyse le palmarès actuel
      push: true                   # Notifier dès qu'il y a du nouveau contenu
      report_mode: "incremental"   # Ne notifier que le nouveau contenu, pour éviter les doublons
      once:                        # Limite l'exécution à une seule fois par plage horaire
        analyze: false             #   Pas de limite sur le nombre d'analyses
        push: false                #   Pas de limite sur le nombre de notifications

    # Aucune plage horaire n'est définie, toute la journée suit default
    #
    # Astuce de syntaxe : {} est l'écriture YAML d'un « dictionnaire vide », indiquant qu'il ne contient rien.
    # Équivaut à l'écrire sur plusieurs lignes sans rien renseigner. Le [] qui suit est analogue : il indique une « liste vide ».
    periods: {}
    day_plans:
      all_day:
        periods: []                   # Liste vide = ce jour-là, aucune plage horaire n'est activée
    week_map:
      1: "all_day"                 # Lundi
      2: "all_day"                 # Mardi
      3: "all_day"                 # Mercredi
      4: "all_day"                 # Jeudi
      5: "all_day"                 # Vendredi
      6: "all_day"                 # Samedi
      7: "all_day"                 # Dimanche


  # ───────────────────────────────────────────────────────────
  # 2️⃣ morning_evening - Synthèse matin et soir (recommandé)
  #
  # Notification des actualités phares actuelles toute la journée + une synthèse de toute la journée le soir.
  # Convient à : la plupart des gens
  #
  # Par défaut (toute la journée) : notification ✓ | analyse IA ✓ | nombre de notifications illimité
  # Synthèse du soir : notification ✓ | analyse IA ✓ | une seule notification/analyse
  # ───────────────────────────────────────────────────────────
  morning_evening:
    name: "Synthèse matin et soir"
    description: "Notification toute la journée + synthèse du jour le soir. Convient à la plupart des gens."

    # Configuration par défaut ── comportement quand aucune plage horaire n'est atteinte
    default:
      collect: true                # Toujours collecter
      analyze: true                # L'IA analyse le palmarès actuel
      ai_mode: "current"           # L'IA analyse le palmarès actuel
      push: true                   # Notifier à chaque fois les actualités phares actuellement au palmarès
      report_mode: "current"       # Les actualités actuellement au palmarès
      # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
      # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
      # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
      once:
        analyze: false             # Pas de limite sur le nombre d'analyses
        push: false                # Pas de limite sur le nombre de notifications

    # Définition des plages horaires ── seule la synthèse du soir nécessite un traitement particulier
    periods:
      evening_summary:
        name: "Synthèse du soir"
        start: "20:00"
        end: "22:00"
        # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
        # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
        # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
        analyze: true              # Analyse IA le soir
        ai_mode: "daily"           # L'IA synthétise aussi le contenu de toute la journée
        report_mode: "daily"       # Bascule vers la synthèse de toutes les actualités du jour
        once:
          analyze: true            # Une seule analyse dans la fenêtre
          push: true               # Une seule notification dans la fenêtre

    # Plan journalier ── assemble les plages horaires en un programme d'une journée
    day_plans:
      all_day:
        periods: ["evening_summary"]

    # Mappage hebdomadaire ── quel plan journalier utiliser chaque jour (1=lundi ... 7=dimanche)
    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"


  # ───────────────────────────────────────────────────────────
  # 3️⃣ office_hours - Notifications aux heures de bureau
  #
  # Notifications en trois temps les jours ouvrés, notifications incrémentales libres le week-end.
  # Convient à : actifs salariés, utilisateurs en entreprise
  #
  # Par défaut (période de silence) : notification ✗ | analyse IA ✗
  # Aperçu à l'arrivée : notification ✓ | analyse IA ✓ | une seule notification
  # Actualités de midi : notification ✓ | analyse IA ✗ | une seule notification
  # Synthèse en fin de journée : notification ✓ | analyse IA ✓ | une seule notification
  # Week-end libre : notification ✓ | analyse IA ✗ | nombre de notifications illimité
  # ───────────────────────────────────────────────────────────
  office_hours:
    name: "Heures de bureau"
    description: "Notifications en trois temps les jours ouvrés (arrivée → midi → fin de journée), notifications incrémentales libres le week-end."

    default:
      collect: true
      analyze: false
      ai_mode: "current"
      push: false                  # Pas de notification par défaut
      report_mode: "current"
      once:
        analyze: true              # Une seule analyse par plage horaire
        push: true                 # Une seule notification par plage horaire

    periods:
      morning_briefing:
        name: "Aperçu à l'arrivée"
        start: "09:00"
        end: "11:00"
        analyze: true              # L'IA analyse les actualités phares actuelles
        ai_mode: "current"         # L'IA analyse le palmarès actuel
        push: true                 # Consulter les actualités phares actuelles à l'arrivée
        report_mode: "current"     # Les actualités actuellement au palmarès
        # once hérite de default (analyze: true, push: true) → une seule notification/analyse

      noon_update:
        name: "Actualités de midi"
        start: "13:00"
        end: "15:00"
        push: true                 # Notification à midi des actualités phares actuellement au palmarès
        report_mode: "current"     # Les actualités actuellement au palmarès
        # analyze hérite de default : false → pas d'analyse IA à midi, pour économiser l'API
        # once hérite de default (push: true) → une seule notification

      closing_summary:
        name: "Synthèse en fin de journée"
        start: "17:00"
        end: "19:00"
        analyze: true              # L'IA fait une analyse de synthèse de toute la journée
        ai_mode: "daily"           # L'IA analyse aussi le contenu de toute la journée
        push: true                 # Notification de la synthèse complète du jour avant de quitter le travail
        report_mode: "daily"       # Synthèse de toutes les actualités du jour
        # once hérite de default (analyze: true, push: true) → une seule notification/analyse

      weekend_free:
        name: "Week-end libre"
        start: "08:00"
        end: "23:00"
        ai_mode: "current"         # L'IA analyse le palmarès actuel
        push: true                 # Notifier dès qu'il y a une nouveauté
        report_mode: "incremental" # Mode incrémental : notifier seulement s'il y a du nouveau, sinon rester silencieux
        once:
          analyze: false           # Pas de limite sur le nombre d'analyses
          push: false              # Pas de limite sur le nombre de notifications

    # Les jours ouvrés utilisent la notification en trois temps ; le week-end utilise le mode incrémental libre
    day_plans:
      workday:
        periods: ["morning_briefing", "noon_update", "closing_summary"]
      weekend:
        periods: ["weekend_free"]  # Week-end : notifier dès qu'il y a une nouveauté, sans perturber le sommeil

    week_map:
      1: "workday"                 # Lundi → plan jour ouvré
      2: "workday"
      3: "workday"
      4: "workday"
      5: "workday"
      6: "weekend"                 # Samedi → plan week-end
      7: "weekend"                 # Dimanche → plan week-end


  # ───────────────────────────────────────────────────────────
  # 4️⃣ night_owl - Mode couche-tard
  #
  # Silence en journée, une notification l'après-midi et une tard le soir.
  # Convient à : travailleurs de nuit, utilisateurs avec décalage horaire à l'étranger, freelances
  #
  # Par défaut (silence en journée) : notification ✗ | analyse IA ✗
  # Aperçu de l'après-midi : notification ✓ | analyse IA ✓ | une seule notification
  # Synthèse tard le soir : notification ✓ | analyse IA ✓ | une seule notification
  # ───────────────────────────────────────────────────────────
  night_owl:
    name: "Mode couche-tard"
    description: "Aperçu de l'après-midi + synthèse de toute la journée tard le soir. Convient aux travailleurs de nuit et aux utilisateurs avec décalage horaire à l'étranger."

    default:
      collect: true
      analyze: false
      ai_mode: "current"
      push: false
      report_mode: "current"
      once:
        analyze: true              # Une seule analyse par plage horaire
        push: true                 # Une seule notification par plage horaire

    periods:
      afternoon_peek:
        name: "Aperçu de l'après-midi"
        start: "15:00"
        end: "17:00"
        analyze: true              # L'IA analyse les actualités phares actuelles
        ai_mode: "current"         # L'IA analyse le palmarès actuel
        push: true                 # Consulter les actualités phares actuelles l'après-midi
        report_mode: "current"     # Les actualités actuellement au palmarès
        # once hérite de default (analyze: true, push: true) → une seule notification/analyse

      late_night:
        name: "Synthèse tard le soir"
        start: "22:00"
        end: "01:00"               # start > end → reconnu automatiquement comme chevauchant minuit
        analyze: true              # L'IA fait une analyse de synthèse de toute la journée
        ai_mode: "daily"           # L'IA analyse aussi le contenu de toute la journée
        push: true                 # Notification de la synthèse complète du jour tard le soir
        report_mode: "daily"       # Synthèse de toutes les actualités du jour
        # once hérite de default (analyze: true, push: true) → une seule notification/analyse

    day_plans:
      all_day:
        periods: ["afternoon_peek", "late_night"]
    week_map:
      1: "all_day"
      2: "all_day"
      3: "all_day"
      4: "all_day"
      5: "all_day"
      6: "all_day"
      7: "all_day"


# ═══════════════════════════════════════════════════════════════
#
# 5️⃣ Mode personnalisé
#
# Lorsque schedule.preset: "custom" est défini dans config.yaml,
# le système lit la section de configuration ci-dessous.
#
# Si les modèles prédéfinis ci-dessus ne répondent pas à vos besoins, vous pouvez tout définir librement ici.
#
# ═══════════════════════════════════════════════════════════════
#
# La logique de la configuration personnalisée est très simple, comme assembler des briques :
#
#   Étape 1 : définir les « briques » (periods)
#            Chaque brique = une plage horaire + ce qu'il faut faire pendant cette plage
#            Par exemple : notification le matin de 08h à 10h, synthèse le soir de 19h à 21h
#
#   Étape 2 : assembler un « programme d'une journée » (day_plans)
#            Combinez les briques pour former le programme d'une journée
#            Par exemple : jours ouvrés [matin, soir], week-end [soir]
#
#   Étape 3 : indiquer « quel programme utiliser chaque jour » (week_map)
#            Du lundi au dimanche, à quel plan journalier chaque jour correspond
#            Par exemple : lundi~vendredi utilisent workday, samedi et dimanche utilisent weekend
#
#   Il y a aussi une « configuration par défaut » (default) :
#   lorsqu'un instant n'appartient à aucune brique, on utilise la configuration par défaut.
#   Les champs non renseignés dans une brique reviennent aussi automatiquement à la configuration par défaut.
#
#
# Voici un exemple complet de personnalisation, où les jours ouvrés et le week-end utilisent des plages horaires différentes :
#
#   Plages horaires des jours ouvrés :
#     Silence nocturne 23:00-06:00 (chevauchant minuit) : collecte ✓ | analyse ✓ | notification ✗
#     Matin jour ouvré 08:00-10:00 : notification ✓ | incremental
#     Synthèse du soir 19:00-21:00 : notification ✓ | analyse ✓ | daily
#     Le reste du temps suit la configuration par défaut (collecte silencieuse)
#
#   Plages horaires du week-end :
#     Silence nocturne 23:00-06:00 (chevauchant minuit) : collecte ✓ | analyse ✓ | notification ✗
#     Matin week-end 10:00-12:00 : notification ✓ | daily
#     Synthèse du soir 19:00-21:00 : notification ✓ | analyse ✓ | daily
#     Le reste du temps suit la configuration par défaut (collecte silencieuse)

custom:
  name: "Personnalisé"
  description: "Définition entièrement libre des plages horaires, des plans journaliers et du mappage hebdomadaire."

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Configuration par défaut
  #
  # Lorsque l'instant courant n'appartient à aucune plage horaire (brique), ce jeu d'interrupteurs est utilisé.
  # Les champs non renseignés dans une plage horaire reviennent aussi ici.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  default:
    collect: true                  # Collecter les données ou non (crawler les palmarès + RSS)
    analyze: false                 # Exécuter l'analyse IA ou non
    ai_mode: "current"            # Mode d'analyse IA :
                                   #   follow_report → suit report_mode
                                   #   daily         → force la synthèse de toute la journée
                                   #   current       → force le palmarès actuel
                                   #   incremental   → force le mode incrémental
    push: false                    # Envoyer des notifications ou non
    report_mode: "current"         # Mode de rapport :
                                   #   daily       → synthèse de toutes les actualités du jour
                                   #   current     → les actualités actuellement au palmarès
                                   #   incremental → ne notifier que le nouveau contenu


    # frequency_file: "general.txt"
                                   # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
                                   # Si vide, utilise le config/frequency_words.txt par défaut
                                   # Ce champ peut aussi être défini dans une plage horaire (period) pour remplacer la valeur par défaut
                                   # Par exemple, utiliser un lexique tech pour la synthèse du soir :
                                   #   frequency_file: "tech.txt"
                                   # Remarque : prend effet uniquement lorsque filter_method vaut keyword

    # interests_file: "finance.txt"
                                   # Fichier de description des intérêts IA (optionnel, situé dans config/custom/ai/)
                                   # Si vide, utilise le config/ai_interests.txt par défaut
                                   # Ce champ peut aussi être défini dans une plage horaire (period) pour remplacer la valeur par défaut
                                   # Par exemple, utiliser des intérêts finance pour la synthèse du soir :
                                   #   interests_file: "finance.txt"
                                   # Remarque : prend effet uniquement lorsque filter_method vaut ai

    # filter_method: "keyword"     # Stratégie de filtrage (optionnel : keyword | ai)
                                   # Si vide, utilise le filter.method global de config.yaml
                                   # Ce champ peut aussi être défini dans une plage horaire (period) pour le remplacer
                                   # Par exemple, utiliser le filtrage IA pour la synthèse du soir :
                                   #   filter_method: "ai"
    once:
      analyze: true                # Une seule analyse dans cette plage horaire (économise l'API)
      push: true                   # Une seule notification dans cette plage horaire (limite les interruptions)


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Étape 1 : définir les briques (plages horaires)
  #
  # Chaque plage horaire a une clé unique (par ex. deep_quiet),
  # ainsi que start / end indiquant la plage de temps où elle s'applique.
  #
  # Il suffit d'écrire « les champs qui diffèrent de default », les autres héritent automatiquement de default.
  # Par exemple, weekday_morning n'écrit pas collect, il hérite donc du collect: true de default.
  #
  # Astuce : si start > end (par ex. 22:00 → 07:00),
  #       le système reconnaît automatiquement une plage horaire chevauchant minuit.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  periods:

    deep_quiet:
      name: "Silence nocturne"
      start: "23:00"
      end: "06:00"                 # 23:00 → 06:00 le lendemain (plage horaire chevauchant minuit)
      # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
      # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
      # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
      collect: true                # Continuer à collecter les données la nuit
      analyze: true                # On peut lancer l'analyse IA la nuit (de toute façon, pas de notification)
      push: false                  # Pas de notification tard le soir, pour éviter de déranger

    weekday_morning:
      name: "Matin jour ouvré"
      start: "08:00"
      end: "10:00"                 # Étendue de 2 h, pour laisser une marge de déclenchement suffisante
      # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
      # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
      # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
      push: true                   # Une notification le matin
      report_mode: "incremental"   # Ne notifier que le nouveau contenu
      # once hérite de default (push: true) → une seule notification dans la fenêtre

    weekend_morning:
      name: "Matin week-end"
      start: "10:00"
      end: "12:00"                 # Étendue de 2 h
      # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
      # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
      # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
      push: true
      report_mode: "daily"         # Le week-end, consulter la synthèse de toute la journée
      # once hérite de default (push: true) → une seule notification dans la fenêtre

    evening_summary:
      name: "Synthèse du soir"
      start: "19:00"
      end: "21:00"
      # frequency_file: "xxx.txt"               # Fichier de mots-clés (optionnel, situé dans config/custom/keyword/)
      # interests_file: "xxx.txt"                # Fichier d'intérêts IA (optionnel, situé dans config/custom/ai/)
      # filter_method: "keyword"                # Stratégie de filtrage (optionnel : keyword | ai ; si vide, utilise le filter.method global)
      analyze: true                # Analyse IA le soir
      ai_mode: "daily"             # L'IA analyse aussi le contenu de toute la journée
      push: true                   # Notification le soir
      report_mode: "daily"         # Synthèse de toutes les actualités du jour
      # once hérite de default (analyze: true, push: true) → une seule analyse/notification


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Étape 2 : assembler les briques en plans journaliers
  #
  # Combinez les plages horaires définies ci-dessus en un programme d'une journée.
  # Vous pouvez définir plusieurs plans journaliers (par ex. workday et weekend),
  # puis les attribuer à différents jours dans le week_map de l'étape 3.
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  day_plans:
    workday:                       # Plan jour ouvré
      periods: ["deep_quiet", "weekday_morning", "evening_summary"]
    weekend:                       # Plan week-end (remplace weekday_morning par weekend_morning)
      periods: ["deep_quiet", "weekend_morning", "evening_summary"]


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Étape 3 : indiquer quel plan journalier utiliser chaque jour
  #
  # 1=lundi  2=mardi  3=mercredi  4=jeudi  5=vendredi  6=samedi  7=dimanche
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  week_map:
    1: "workday"                   # Lundi → plan jour ouvré
    2: "workday"                   # Mardi
    3: "workday"                   # Mercredi
    4: "workday"                   # Jeudi
    5: "workday"                   # Vendredi
    6: "weekend"                   # Samedi → plan week-end
    7: "weekend"                   # Dimanche


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Stratégie de conflit (généralement inutile à modifier)
  #
  # Qu'est-ce qu'un « conflit » ?
  #   Si deux de vos plages horaires se chevauchent (par ex. A est 08:00-12:00, B est 10:00-14:00),
  #   alors la tranche 10:00-12:00 appartient à la fois à A et à B, ce qui crée un conflit.
  #   Le programme doit alors savoir : laquelle suivre ?
  #
  # Deux modes de traitement :
  #
  #   error_on_overlap (recommandé)
  #     Lève directement une erreur, pour vous rappeler de modifier la configuration.
  #     Convient à la plupart des gens —— un chevauchement de plages horaires est généralement une erreur, et l'erreur permet de la détecter à temps.
  #
  #   last_wins
  #     Dans la liste periods d'un day_plans, celui écrit en dernier est prioritaire.
  #     Par exemple periods: ["A", "B"], en cas de chevauchement c'est B qui s'applique.
  #     Cas d'usage : vous voulez poser une grande plage horaire en fond, puis la recouvrir avec une plage plus petite écrite ensuite.
  #
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  overlap:
    policy: "error_on_overlap"
