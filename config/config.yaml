# Éditeur de configuration visuel : https://sansan0.github.io/TrendRadar/
# (l'éditeur web local se trouve dans docs/index.html — bilingue FR/EN)


# ===============================================================
# 1. Réglages de base
# ===============================================================
app:
  # Fuseau horaire (affichage des heures, planification, stockage des données)
  # Exemples courants :
  #   - Europe/Paris (heure de Paris, UTC+1/+2)
  #   - Asia/Shanghai (heure de Pékin, UTC+8)
  #   - America/New_York (heure de New York, UTC-5/-4)
  # Liste complète : https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Europe/Paris"
  show_version_update: true           # Afficher les notifications de mise à jour (true=oui, false=non)


# ===============================================================
# 1.5 Système de planification — quoi faire et quand
#
# Les plages horaires définies dans timeline.yaml déterminent automatiquement :
#   - quand envoyer les notifications
#   - quand lancer l'analyse IA
#   - quel mode de rapport utiliser
#
# Démarrage rapide : choisissez un modèle prédéfini et changez la valeur de preset.
#
#   always_on       → en continu, notification dès qu'il y a du nouveau
#   morning_evening → notifications toute la journée + synthèse du soir (recommandé)
#   office_hours    → 3 temps en semaine (arrivée → midi → fin de journée), week-end libre
#   night_owl       → aperçu d'après-midi + synthèse complète tard le soir
#   custom          → entièrement personnalisé, voir timeline.yaml
#
# Schéma détaillé des plages : config/timeline.yaml
# ===============================================================
schedule:
  enabled: false                        # Activer la planification (true=oui, false=non, désactivé par défaut)
  preset: "morning_evening"             # Nom du modèle prédéfini (voir ci-dessus)


# ===============================================================
# 2. Source de données — Palmarès (« hot lists »)
#
# IMPORTANT (fork halal-niche) : les palmarès chinois d'origine sont DÉSACTIVÉS — la liste
# « sources » est vide. On NE met PAS platforms.enabled à false (cela ferait quitter l'app
# avant la récupération RSS) : on garde enabled=true avec une liste de sources vide, de sorte
# que seul le pipeline RSS (section 3) s'exécute.
#
# Données fournies par le projet open source newsnow : https://github.com/ourongxing/newsnow
# Pour réactiver des palmarès, ajoutez des entrées dans « sources » (voir l'exemple « legacy »).
#
# enabled : active la récupération des palmarès (interrupteur général — NE PAS mettre à false ici)
# api_url : URL de l'API des palmarès (optionnel, vide = adresse par défaut)
# sources : liste des plateformes
#   - id : identifiant unique (ne pas modifier)
#   - name : nom affiché (personnalisable)
#   - expected_domain : contrôle de sécurité du domaine (optionnel, recommandé)
# ===============================================================
platforms:
  enabled: true                         # Garder true (voir note ci-dessus) ; la liste sources vide = aucun palmarès
  api_url: ""                           # URL de l'API des palmarès (vide = adresse par défaut)
  sources: []                           # Palmarès désactivés pour ce fork halal-niche

  # --- Sources « legacy » d'origine (palmarès chinois), désactivées ---
  # Pour réactiver, déplacez les entrées voulues dans « sources » ci-dessus.
  #   - id: "toutiao"
  #     name: "Toutiao"
  #     expected_domain: "toutiao.com"
  #   - id: "baidu"
  #     name: "Baidu (tendances)"
  #     expected_domain: "baidu.com"
  #   - id: "weibo"
  #     name: "Weibo"
  #     expected_domain: "weibo.com"
  #   - id: "zhihu"
  #     name: "Zhihu"
  #     expected_domain: "zhihu.com"


# ===============================================================
# 3. Source de données — Flux RSS (cœur du fork halal-niche)
#
# Stockage séparé des palmarès, affichage par flux temporel.
# Chaque source : id (identifiant unique), name (nom affiché), url (adresse du flux).
# enabled : optionnel, true par défaut.
# max_age_days : optionnel, surcharge freshness_filter.max_age_days global.
#
# Les flux activés ci-dessous ont été VÉRIFIÉS (HTTP 200 + items réels) au moment de l'écriture.
# Les flux non vérifiés sont laissés en commentaire avec un TODO (à confirmer avant activation).
# ===============================================================
rss:
  enabled: true                       # Activer la récupération RSS (true=oui, false=non)

  # Filtre de fraîcheur des articles (évite de re-pousser de vieux articles)
  # Ne filtre qu'au moment de la notification ; tous les articles restent stockés en base.
  freshness_filter:
    enabled: true                     # Activer le filtre de fraîcheur (true=oui, false=non)

    max_age_days: 7                   # Âge maximal des articles (jours)
                                      # - entier positif : ne pousser que les articles des N derniers jours
                                      # - 0 : désactive le filtre, pousse tous les articles
                                      # (7 jours : adapté à des flux de niche moins fréquents)

  # Chaque flux peut surcharger max_age_days :
  # - non défini : utilise le max_age_days global
  # - entier positif : surcharge ; ne pousse que les articles de ces N jours
  # - 0 : désactive le filtre de fraîcheur pour ce flux
  feeds:
    # --- Économie islamique mondiale (food, finance, mode, voyage, certification…) ---
    - id: "salaam-gateway"
      name: "Salaam Gateway"
      url: "https://salaamgateway.com/feed"

    - id: "islamic-finance-guru"
      name: "Islamic Finance Guru"
      url: "https://www.islamicfinanceguru.com/feed"

    # --- Actualité Golfe / MENA (anglophone) ---
    - id: "the-national"
      name: "The National (Golfe)"
      url: "https://www.thenationalnews.com/arc/outboundfeeds/rss/?outputType=xml"

    - id: "middle-east-eye"
      name: "Middle East Eye"
      url: "https://www.middleeasteye.net/rss"

    - id: "al-jazeera"
      name: "Al Jazeera"
      url: "https://www.aljazeera.com/xml/rss/all.xml"

    # --- Communauté & mode de vie musulmans (anglophone) ---
    - id: "muslim-matters"
      name: "MuslimMatters"
      url: "https://muslimmatters.org/feed/"

    - id: "about-islam"
      name: "About Islam"
      url: "https://aboutislam.net/feed/"

    # --- Francophone halal / musulman ---
    - id: "saphirnews"
      name: "Saphirnews"
      url: "https://www.saphirnews.com/xml/syndication.rss"

    - id: "al-kanz"
      name: "Al-Kanz (conso halal)"
      url: "https://www.al-kanz.org/feed/"

    - id: "oumma"
      name: "Oumma"
      url: "https://oumma.com/feed/"

    - id: "mizane"
      name: "Mizane.info"
      url: "https://www.mizane.info/feed/"

    # --- TODO : flux candidats NON vérifiés (corriger l'URL puis décommenter) ---
    # - id: "dinar-standard"        # 404 sur /feed — trouver l'URL du flux
    #   name: "DinarStandard"
    #   url: "https://www.dinarstandard.com/feed"
    # - id: "islamic-finance-news"  # 403 (bloqué) — vérifier l'accès
    #   name: "Islamic Finance News"
    #   url: "https://www.islamicfinancenews.com/feed"
    # - id: "arab-news"             # 403 (bloqué) — vérifier l'accès
    #   name: "Arab News"
    #   url: "https://www.arabnews.com/rss.xml"
    # - id: "gulf-news"             # 404 — trouver l'URL du flux
    #   name: "Gulf News"
    #   url: "https://gulfnews.com/rss"
    # - id: "halal-times"           # 200 mais pas d'items détectés — confirmer l'URL du flux
    #   name: "Halal Times"
    #   url: "https://www.halaltimes.com/feed/"
    # - id: "le-muslim-post"        # 200 mais pas d'items détectés — confirmer l'URL du flux
    #   name: "Le Muslim Post"
    #   url: "https://lemuslimpost.com/feed/"


# ===============================================================
# 4. Mode de rapport
# ===============================================================
report:
  mode: "current"                     # Mode de rapport (valeur par défaut si schedule activé, surchargée par timeline)
                                      # daily = synthèse du jour, pousse toutes les actus correspondantes du jour
                                      # current = palmarès actuel, pousse les actus correspondantes en cours
                                      # incremental = suivi des nouveautés uniquement, zéro doublon

  display_mode: "keyword"             # Dimension de regroupement
                                      # keyword = regroupement par mots-clés / tags
                                      # platform = regroupement par plateforme / source

  sort_by_position_first: false       # Tri en mode mots-clés (uniquement si display_mode=keyword)
                                      # true = ordre de définition de frequency_words.txt
                                      # false = tri par nombre d'actus correspondantes (les plus nombreuses d'abord)

  rank_threshold: 5                   # Seuil de mise en avant du classement (affichage uniquement)

  max_news_per_keyword: 0             # Nombre max d'actus affichées par mot-clé / tag (0=illimité)


# ===============================================================
# 4.5 Stratégie de filtrage
# ===============================================================
filter:
  method: "ai"                          # Méthode de filtrage (au choix)
                                       # keyword = correspondance par mots-clés, sans IA, sans coût de tokens
                                       #           (groupes définis dans config/frequency_words.txt)
                                       # ai = classification intelligente par IA, plus souple mais consomme des tokens
                                       #      (centres d'intérêt dans config/ai_interests.txt, voir ai_filter ci-dessous)

  priority_sort_enabled: true          # Tri des tags en mode IA (uniquement si method=ai)
                                       # true = ordre de définition des centres d'intérêt
                                       # false = tri par nombre de correspondances


# ===============================================================
# 4.6 Configuration du filtrage IA (uniquement si filter.method=ai)
# ===============================================================
ai_filter:
  batch_size: 200                         # Nombre de titres envoyés à l'IA par lot
  batch_interval: 2                       # Intervalle entre lots (secondes), 0=sans attente

  min_score: 0.7                          # Score minimal pour pousser (0.0~1.0), plus élevé = plus strict
                                          # Démarrer entre 0.5 et 0.7, 0=pas de filtrage

  # Fichier de centres d'intérêt (défaut config/ai_interests.txt, aucune config nécessaire)
  # Fichier personnalisé dans config/custom/ai/ puis indiquer le nom :
  # interests_file: "finance.txt"    # → charge config/custom/ai/finance.txt

  reclassify_threshold: 0.6              # Seuil de re-classification complète (0~1)
                                          # plus bas = plus de re-classification complète (plus précis, plus de tokens)
                                          # plus haut = plutôt incrémental (plus économe)

  # Modèles de prompts ci-dessous (en général inutile de modifier)
  prompt_file: "prompt.txt"               # Modèle de prompt de classification
  extract_prompt_file: "extract_prompt.txt"   # Modèle d'extraction des tags (première exécution)
  update_tags_prompt_file: "update_tags_prompt.txt"  # Modèle de mise à jour des tags


# ===============================================================
# 5. Contrôle du contenu des notifications
#
# Gère les zones affichées dans les notifications et leur ordre.
# ===============================================================
display:
  # Ordre d'affichage des zones (de haut en bas)
  # Pour afficher une zone : 1. la lister ici  2. activer son interrupteur dans « regions » ci-dessous
  region_order:
    - new_items                           # 1️⃣ Zone des nouveautés
    - hotlist                             # 2️⃣ Zone palmarès (correspondance mots-clés / filtrage IA)
    - rss                                 # 3️⃣ Zone flux RSS
    - standalone                          # 4️⃣ Zone d'affichage autonome
    - ai_analysis                         # 5️⃣ Zone d'analyse IA

  # Interrupteurs des zones (à utiliser avec region_order ci-dessus)
  regions:
    hotlist: true                     # Zone palmarès : correspondance mots-clés / filtrage IA (vide si aucun palmarès)
    new_items: false                  # Zone des nouveautés : palmarès + RSS nouveaux (true=afficher, false=masquer)

    rss: true                         # Zone flux RSS (true=afficher et analyser, false=masquer et ignorer)
    standalone: false                 # Zone autonome : palmarès/RSS complets, sans filtrage par mots-clés
    ai_analysis: true                 # Zone d'analyse IA (true=afficher, false=masquer)

  # Zone autonome : affiche intégralement certaines plateformes/RSS, sans filtrage par mots-clés
  standalone:
    platforms: []                                # Liste d'ids de palmarès (vide pour ce fork)
    rss_feeds: []                                # Liste d'ids de flux RSS (ex. ["salaam-gateway"])
    max_items: 20                                # Nombre max d'items affichés par source (0=illimité)


# ===============================================================
# 6. Notifications
#
# ⚠️ Sécurité : ne publiez JAMAIS vos webhooks / jetons !
#    En déploiement (GitHub Actions), mettez-les dans GitHub Secrets / variables d'environnement,
#    pas dans ce fichier. Variables : TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, EMAIL_FROM,
#    EMAIL_PASSWORD, EMAIL_TO, EMAIL_SMTP_SERVER, EMAIL_SMTP_PORT, etc.
#
# 📌 Multi-comptes : séparés par un point-virgule (;), ex. "url1;url2;url3"
# ===============================================================
notification:
  enabled: true                       # Activer les notifications (true=oui, false=non) — interrupteur général
                                      # (si aucun canal n'est configuré, l'app collecte sans rien envoyer)

  # Configuration des canaux (laisser vide ici ; renseigner via variables d'environnement)
  channels:
    feishu:
      webhook_url: ""                 # Webhook du robot Feishu

    dingtalk:
      webhook_url: ""                 # Webhook du robot DingTalk

    wework:
      webhook_url: ""                 # Webhook du robot WeCom (entreprise)
      msg_type: "markdown"            # Type de message : markdown (robot de groupe) | text (appli WeChat perso)

    telegram:
      bot_token: ""                   # Jeton du bot Telegram (préférer TELEGRAM_BOT_TOKEN)
      chat_id: ""                     # Identifiant de chat Telegram (préférer TELEGRAM_CHAT_ID)

    email:
      from: ""                        # Adresse e-mail de l'expéditeur (préférer EMAIL_FROM)
      password: ""                    # Mot de passe / code d'application (préférer EMAIL_PASSWORD)
      to: ""                          # Destinataires, séparés par des virgules (préférer EMAIL_TO)
      smtp_server: ""                 # Serveur SMTP (optionnel, vide = détection automatique)
      smtp_port: ""                   # Port SMTP (optionnel, vide = détection automatique)

    ntfy:
      server_url: "https://ntfy.sh"   # Adresse du serveur ntfy (auto-hébergeable)
      topic: ""                       # Nom du topic ntfy
      token: ""                       # Jeton d'accès ntfy (optionnel, topics privés)

    bark:
      url: ""                         # URL de notification Bark (https://api.day.app/votre_cle)

    slack:
      webhook_url: ""                 # URL Slack Incoming Webhook

    generic_webhook:
      webhook_url: ""                 # Webhook générique (Discord, Matrix, IFTTT, etc.)
      payload_template: ""            # Modèle JSON, supporte {title} et {content}
                                      # Exemple : {"content": "{content}"}
                                      # Vide = format par défaut : {"title": "{title}", "content": "{content}"}


# ===============================================================
# 7. Stockage
# ===============================================================
storage:
  # Choix du backend de stockage
  # - auto : choix automatique (GitHub Actions + stockage distant configuré → remote, sinon → local)
  # - local : SQLite local + fichiers TXT/HTML
  # - remote : stockage cloud distant (protocole compatible S3 : R2/OSS/COS, etc.)
  backend: "auto"

  # Formats de données
  formats:
    sqlite: true                      # Stockage principal (laisser true, ne pas désactiver)
    txt: false                        # Générer un instantané TXT (true=oui, false=non)
    html: true                        # Générer des rapports HTML (true=oui, false=non)
                                      # ⚠️ Indispensable pour l'envoi par e-mail ou la version web du rapport

  # Stockage local
  local:
    data_dir: "output"                # Répertoire des données
    retention_days: 0                 # Jours de rétention (0=conservation permanente)

  # Stockage distant (protocole compatible S3)
  # Supporte : Cloudflare R2, Alibaba OSS, Tencent COS, AWS S3, MinIO, etc.
  # Mettez les informations sensibles dans GitHub Secrets / variables d'environnement.
  remote:
    retention_days: 0                 # Jours de rétention (0=conservation permanente)

    # Configuration compatible S3 (ou variables d'environnement S3_ENDPOINT_URL, etc.)
    endpoint_url: ""                  # Point de terminaison du service
                                      # Cloudflare R2 : https://<account_id>.r2.cloudflarestorage.com
                                      # AWS S3 : https://s3.<region>.amazonaws.com
    bucket_name: ""                   # Nom du bucket
    access_key_id: ""                 # Clé d'accès (ID)
    secret_access_key: ""             # Clé d'accès (secret)
    region: ""                        # Région (optionnel selon le fournisseur)

  # Synchronisation des données (distant → local, utile pour le serveur MCP)
  pull:
    enabled: false                    # Récupération automatique au démarrage (true=oui, false=non)
    days: 7                           # Récupérer les données des N derniers jours


# ===============================================================
# 8. Configuration du modèle IA (partagée par ai_analysis / ai_translation / ai_filter)
#
# Ce fork utilise OpenRouter (passerelle compatible OpenAI) pour router les modèles.
# Renseignez votre clé OpenRouter via la variable d'environnement AI_API_KEY.
# ===============================================================
ai:
  # Format de modèle LiteLLM : fournisseur/nom-de-modèle
  # Via OpenRouter (recommandé pour ce fork) :
  #   - openrouter/anthropic/claude-sonnet-4   (Anthropic Claude Sonnet 4)
  #   - openrouter/anthropic/claude-sonnet-4.6 (variante plus récente — voir CHANGES.md)
  #   - openrouter/deepseek/deepseek-v4-flash  (DeepSeek, économique)
  # En direct chez le fournisseur (nécessite la clé correspondante) :
  #   - anthropic/claude-sonnet-4-20250514, openai/gpt-4o, gemini/gemini-2.5-flash, ollama/llama3
  # Liste complète : https://docs.litellm.ai/docs/providers et https://openrouter.ai/models

  model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"

  api_key: ""                       # Clé API (utiliser la variable d'environnement AI_API_KEY = clé OpenRouter)

  api_base: ""                      # URL d'API personnalisée (laisser vide avec OpenRouter natif openrouter/…)
                                    # Alternative compatible OpenAI : préfixe "openai/" + api_base
                                    #   model: "openai/anthropic/claude-sonnet-4"
                                    #   api_base: "https://openrouter.ai/api/v1"

  timeout: 120                      # Délai d'expiration des requêtes (secondes)

  temperature: 1.0                  # Température d'échantillonnage (0.0-2.0)

  max_tokens: 5000                  # Nombre max de tokens générés (mettre 0 pour ne pas envoyer ce paramètre)

  # Options avancées
  num_retries: 1                    # Nombre de tentatives en cas d'échec
  fallback_models:                  # Modèles de secours (gratuits, pour rester à coût nul)
    - "openrouter/meta-llama/llama-3.3-70b-instruct:free"

  # Paramètres supplémentaires (rarement nécessaires)
  # extra_params:
  #   top_p: 1.0
  #   presence_penalty: 0.0


# ===============================================================
# 9. Analyse IA (configuration du modèle dans la section « ai » ci-dessus)
# ===============================================================
ai_analysis:
  enabled: true                     # Activer l'analyse IA (true=oui, false=non) — interrupteur général

  language: "Français"              # Langue du rapport d'analyse (ex. "English", "Français")
  prompt_file: "ai_analysis_prompt.txt"   # Fichier de prompt (relatif au dossier config)

  mode: "follow_report"             # Mode d'analyse IA (peut différer de report.mode)
                                    # follow_report = suit report.mode (défaut)
                                    # daily / current / incremental = force le mode indiqué

  max_news_for_analysis: 150        # Nombre max d'actus analysées (maîtrise du coût en tokens)

  include_rss: true                 # Inclure le contenu RSS dans l'analyse (true=oui) — ESSENTIEL pour ce fork RSS
  include_standalone: true          # Inclure les données de la zone autonome (true=oui, false=non)

  include_rank_timeline: true       # Niveau de détail de la chronologie de classement
                                    # true = trajectoire complète (plus précis, plus de tokens)
                                    # false = format simplifié (plus économe)


# ===============================================================
# 10. Traduction IA (configuration du modèle dans la section « ai » ci-dessus)
#
# Traduit les titres poussés (hors contenu de l'analyse IA).
# ===============================================================
ai_translation:
  enabled: true                     # Activer la traduction (true=oui, false=non)
  language: "Français"              # Langue cible de traduction (ex. "English", "Français")
  prompt_file: "ai_translation_prompt.txt"   # Fichier de prompt (relatif au dossier config)

  # Périmètre de traduction (les zones désactivées dans display.regions ne sont pas traduites)
  scope:
    hotlist: false                  # Traduire les titres des palmarès (true=oui, false=non)
    rss: true                       # Traduire les titres RSS (true=oui, false=non)
    standalone: true                # Traduire les titres de la zone autonome (true=oui, false=non)


# ===============================================================
# 11. Réglages avancés (en général inutile de modifier)
# ===============================================================
advanced:
  debug: false                        # Mode debug (true=logs détaillés, false=normal)

  # Vérification de version
  version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version"
  mcp_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_mcp"
  configs_version_check_url: "https://raw.githubusercontent.com/sansan0/TrendRadar/refs/heads/master/version_configs"

  # Paramètres techniques du crawler de palmarès
  crawler:
    request_interval: 2000            # Intervalle entre requêtes (millisecondes)
    use_proxy: false                  # Activer le proxy (true=oui, false=non)
    default_proxy: "http://127.0.0.1:10801"

  # Réglages RSS
  rss:
    request_interval: 1000            # Intervalle entre requêtes (millisecondes)
    timeout: 15                       # Délai d'expiration (secondes)
    use_proxy: false                  # Utiliser un proxy (true=oui, false=non)
    proxy_url: ""                     # Proxy dédié RSS (vide = crawler.default_proxy)

  # Pondération du tri (réordonne les tendances de différentes plateformes)
  # La somme vaut 1
  weight:
    rank: 0.6                         # Poids du classement
    frequency: 0.3                    # Poids de la fréquence
    hotness: 0.1                      # Poids de la popularité

  # Limite multi-comptes
  max_accounts_per_channel: 3         # Nombre max de comptes par canal

  # Paramètres internes (en général à ne pas modifier)
  # Taille des lots de messages (octets) — configuration interne
  batch_size:
    default: 4000
    dingtalk: 20000
    feishu: 30000
    bark: 4000
    slack: 4000
  batch_send_interval: 3              # Intervalle d'envoi entre lots (secondes)
  feishu_message_separator: "━━━━━━━━━━━━━━━━"
