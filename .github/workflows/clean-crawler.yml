name: Check In

# ✅ Renouvellement : lancer ce workflow réinitialise le compteur de 7 jours et maintient "Get Hot News" actif
# ✅ Renewal: Run this workflow to reset the 7-day timer and keep "Get Hot News" active
#
# 📌 Mode d'emploi / How to use:
#   1. Cliquez sur le bouton "Run workflow" / Click "Run workflow" button
#   2. Lancez-le au moins une fois tous les 7 jours / Run at least once every 7 days

on:
  workflow_dispatch:

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"