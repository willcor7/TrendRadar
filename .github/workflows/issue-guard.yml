name: Issue Guard

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]
  pull_request_review_comment:
    types: [created]

jobs:
  moderate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      models: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Modération de contenu par IA (détection de spam + détection de liens + détection de contenu généré par IA)
      - uses: github/ai-moderator@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          spam-label: 'spam'
          ai-label: 'ai-generated'
          minimize-detected-comments: true
          enable-spam-detection: true
          enable-link-spam-detection: true
          enable-ai-detection: true

      # Double protection :
      # 1) Compte < 7 jours → suppression/fermeture directe
      # 2) Compte >= 7 jours + jugé spam par l'IA → suppression/fermeture également
      - name: Spam defense
        uses: actions/github-script@v7
        with:
          script: |
            const MIN_ACCOUNT_AGE_DAYS = 7;
            const event = context.eventName;

            // Analyse du contexte de l'événement
            let username, authorAssociation, number, nodeId, commentId;
            let isIssue = false, isPR = false, isComment = false;

            if (event === 'issues') {
              const issue = context.payload.issue;
              username = issue.user.login;
              authorAssociation = issue.author_association;
              number = issue.number;
              isIssue = true;
            } else if (event === 'issue_comment') {
              const comment = context.payload.comment;
              username = comment.user.login;
              authorAssociation = comment.author_association;
              number = context.payload.issue.number;
              nodeId = comment.node_id;
              commentId = comment.id;
              isComment = true;
              isIssue = true;
            } else if (event === 'pull_request') {
              const pr = context.payload.pull_request;
              username = pr.user.login;
              authorAssociation = pr.author_association;
              number = pr.number;
              isPR = true;
            } else if (event === 'pull_request_review_comment') {
              const comment = context.payload.comment;
              username = comment.user.login;
              authorAssociation = comment.author_association;
              number = context.payload.pull_request.number;
              nodeId = comment.node_id;
              commentId = comment.id;
              isComment = true;
              isPR = true;
            }

            // Ignorer les membres du projet
            if (['OWNER', 'MEMBER', 'COLLABORATOR'].includes(authorAssociation)) {
              core.info(`Skip: ${username} (${authorAssociation})`);
              return;
            }

            // Récupérer l'ancienneté du compte
            const { data: user } = await github.rest.users.getByUsername({ username });
            const accountAgeDays = Math.floor((Date.now() - new Date(user.created_at)) / 86400000);
            const isNewAccount = accountAgeDays < MIN_ACCOUNT_AGE_DAYS;

            // Déterminer s'il faut bloquer
            let shouldBlock = false;
            let reason = '';

            if (isNewAccount) {
              // Premier niveau : blocage direct des nouveaux comptes
              shouldBlock = true;
              reason = `new account (${accountAgeDays}d < ${MIN_ACCOUNT_AGE_DAYS}d)`;
            } else {
              // Deuxième niveau : pour les comptes anciens, vérifier le jugement de spam par l'IA
              let isSpam = false;
              if (isComment) {
                const { node } = await github.graphql(`
                  query($id: ID!) {
                    node(id: $id) {
                      ... on IssueComment { isMinimized }
                      ... on PullRequestReviewComment { isMinimized }
                    }
                  }
                `, { id: nodeId });
                isSpam = node?.isMinimized === true;
              } else {
                const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                  ...context.repo,
                  issue_number: number
                });
                isSpam = labels.some(l => l.name === 'spam');
              }

              if (isSpam) {
                shouldBlock = true;
                reason = `spam detected (account age: ${accountAgeDays}d)`;
              }
            }

            if (!shouldBlock) {
              core.info(`${username} (${accountAgeDays}d): OK`);
              return;
            }

            core.info(`Blocking ${event} #${number} from ${username}: ${reason}`);

            // Générer un message différent selon la raison du blocage
            const notice = isNewAccount
              ? [
                  `@${username} Bonjour, merci de l'intérêt que vous portez à ce projet !`,
                  '',
                  `Afin de préserver l'environnement de la communauté et de prévenir le spam et les interférences des bots automatisés,`,
                  `ce projet exige que le compte GitHub ait au moins **${MIN_ACCOUNT_AGE_DAYS} jours** d'ancienneté pour pouvoir participer.`,
                  '',
                  `Votre compte a ${accountAgeDays} jours d'ancienneté, vous ne pouvez donc pas participer pour l'instant.`,
                  `Veuillez soumettre à nouveau une fois que votre compte aura atteint ${MIN_ACCOUNT_AGE_DAYS} jours, ou nous contacter via les coordonnées indiquées dans le README du projet.`,
                  '',
                  'Merci de votre compréhension et de votre soutien 🙏',
                ].join('\n')
              : [
                  `@${username} Bonjour,`,
                  '',
                  'Votre contenu a été signalé comme spam par le système de modération automatique et a été supprimé.',
                  '',
                  `**En cas d'erreur, veuillez nous en excuser !** Merci de nous contacter via les coordonnées indiquées dans le README du projet.`,
                  '',
                  'Merci de votre compréhension 🙏',
                ].join('\n');

            // Exécuter l'action de blocage
            if (isComment) {
              // Commentaire : suppression directe
              if (isIssue) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: commentId
                });
              } else {
                await github.rest.pulls.deleteReviewComment({
                  ...context.repo,
                  comment_id: commentId
                });
              }
            } else if (isIssue) {
              // Nouvelle Issue : commentaire d'avertissement → fermeture → verrouillage
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: notice
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: number,
                state: 'closed',
                state_reason: 'not_planned'
              });
              await github.rest.issues.lock({
                ...context.repo,
                issue_number: number,
                lock_reason: 'spam'
              });
            } else if (isPR) {
              // Nouvelle PR : commentaire d'avertissement → fermeture
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: number,
                body: notice
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: number,
                state: 'closed'
              });
            }
