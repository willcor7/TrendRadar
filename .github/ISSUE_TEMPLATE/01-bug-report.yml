# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 🐛 J'ai rencontré un problème
description: Le programme ne fonctionne pas correctement, génère une erreur ou une fonctionnalité est défaillante (y compris les problèmes d'analyse IA)
title: "[Problème] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### ⚠️ À lire avant de soumettre
        **Assurez-vous d'utiliser la dernière version de TrendRadar.**
        De nombreux problèmes sont peut-être déjà corrigés dans le code le plus récent. Si vous utilisez une ancienne version, je ne pourrai pas traiter votre demande ; veuillez d'abord mettre à jour puis réessayer.

        **Une description simple + des captures d'écran clés** est le moyen de communication le plus efficace.

        ---
        ### 📌 Comment consulter le numéro de version ?

        | Mode de déploiement | Méthode de consultation |
        |---------|---------|
        | **Docker** | Consultez les logs de démarrage du conteneur, le numéro de version s'affiche au début des logs |
        | **GitHub Actions** | Consultez le badge ![version](https://img.shields.io/badge/version-blue) en haut de la [documentation README](https://github.com/sansan0/TrendRadar) |
        | **Python local** | Consultez le fichier `version` à la racine du projet |

  - type: input
    id: version
    attributes:
      label: 📦 Version de TrendRadar
      description: |
        Veuillez impérativement fournir le numéro de version (par ex. : v5.2.0 ou git commit id)
        💡 Utilisateurs Docker : consultez les logs de démarrage du conteneur | Utilisateurs GitHub Actions : consultez le badge version en haut de la documentation
      placeholder: v5.2.0 ou commit hash
    validations:
      required: true

  - type: input
    id: mcp-version
    attributes:
      label: 🔌 Version du MCP Server (facultatif)
      description: Si vous passez par MCP, veuillez indiquer la version du MCP Server.
      placeholder: v3.1.6 (laisser vide pour les utilisateurs non-MCP)
    validations:
      required: false

  - type: dropdown
    id: bug-category
    attributes:
      label: 🏷️ Catégorie du problème
      options:
        - Lié à l'analyse IA (erreur, contenu anormal, prompt inopérant, etc.)
        - Lié à la récupération de données (impossible de récupérer les actualités, plateforme défaillante, etc.)
        - Lié aux notifications (messages non reçus, erreur de notification, etc.)
        - Lié au déploiement / à l'exécution (erreurs Docker, Actions, Python)
        - Autre
    validations:
      required: true

  - type: input
    id: ai-model
    attributes:
      label: 🤖 Nom du modèle IA (obligatoire pour les problèmes IA)
      description: |
        S'il s'agit d'un problème lié à l'analyse IA, veuillez fournir le nom exact du modèle que vous utilisez.
        Les problèmes IA sont étroitement liés aux capacités du modèle, et les performances varient beaucoup d'un modèle à l'autre.
      placeholder: "par ex. : deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: bug-description
    attributes:
      label: 📝 Décrivez ce qui s'est passé
      placeholder: |
        Veuillez décrire :
        1. Que faisiez-vous ?
        2. Quelle erreur est apparue ? (S'il s'agit d'un problème IA, collez le message d'erreur de l'échec d'analyse)
        3. Il est conseillé de joindre une capture d'écran, c'est plus parlant que du texte !
    validations:
      required: true

  - type: textarea
    id: error-logs
    attributes:
      label: 📋 Logs d'erreur / configuration (facultatif)
      description: |
        Collez les logs d'erreur pertinents ou un extrait de config.yaml (pensez à masquer les informations sensibles comme les clés API)
        💡 Utilisateurs Docker : utilisez `docker logs trendradar` pour consulter les logs
      placeholder: |
        Collez les logs d'erreur pertinents ou un extrait de config.yaml :
        ```
        Collez le contenu ici...
        ```
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Captures d'écran (vivement recommandé)
      description: |
        ⚠️ **Important** : veuillez fournir une **capture d'écran complète**, ne capturez pas seulement une partie !
        - La capture d'erreur doit inclure le message d'erreur complet et son contexte
        - La capture de notification doit inclure le contenu complet du message
        - La capture de configuration doit inclure le contenu complet de la section concernée

        Les captures partielles manquent souvent d'informations clés, ce qui rend le diagnostic difficile.
      placeholder: Glissez-déposez vos captures d'écran ici, en veillant à ce qu'elles soient complètes et contiennent suffisamment de contexte.
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: 🖥️ Environnement utilisé
      options:
        - Docker (local/NAS)
        - GitHub Actions
        - Exécution Python locale
        - Client MCP Server (Cherry Studio, etc.)
    validations:
      required: true
