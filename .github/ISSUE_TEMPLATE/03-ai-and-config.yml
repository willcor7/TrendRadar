# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: ✨ Partage de prompts IA et aide à la configuration
description: Partagez votre ai_analysis_prompt.txt optimisé ou demandez de l'aide pour le paramétrage
title: "[IA/Config] "
labels: ["config", "AI"]
body:
  - type: markdown
    attributes:
      value: |
        ### ✨ Programme de partage de prompts
        N'hésitez pas à partager ici le contenu de votre `ai_analysis_prompt.txt` soigneusement optimisé !
        Un bon prompt peut rendre l'analyse IA plus précise et plus intéressante.

        ---
        Si vous **demandez de l'aide pour la configuration**, veuillez décrire au mieux le comportement erroné observé.

        ---
        ### 📌 Comment consulter le numéro de version ?

        | Mode de déploiement | Méthode de consultation |
        |---------|---------|
        | **Docker** | Consultez les logs de démarrage du conteneur, le numéro de version s'affiche au début des logs |
        | **GitHub Actions** | Consultez le badge ![version](https://img.shields.io/badge/version-blue) en haut de la [documentation README](https://github.com/sansan0/TrendRadar) |
        | **Python local** | Consultez le fichier `version` à la racine du projet |

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Objectif
      options:
        - Partager mon prompt IA (ai_analysis_prompt.txt)
        - Demander de l'aide pour le paramétrage de l'analyse IA
        - Demander de l'aide pour la configuration des fonctionnalités de base (Webhook/RSS, etc.)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 Version de TrendRadar (obligatoire en cas de demande d'aide)
      description: |
        Si vous demandez de l'aide, veuillez fournir le numéro de version.
        💡 Utilisateurs Docker : consultez les logs de démarrage du conteneur | Utilisateurs GitHub Actions : consultez le badge version en haut de la documentation
      placeholder: v5.2.0 ou commit hash (peut rester vide pour un partage de prompt)
    validations:
      required: false

  - type: input
    id: ai-model
    attributes:
      label: 🤖 Nom du modèle IA
      description: |
        Veuillez fournir le nom exact du modèle que vous utilisez.
        L'efficacité de l'analyse IA est étroitement liée aux capacités du modèle, et les performances varient beaucoup d'un modèle à l'autre.
        Lors d'un partage de prompt, merci de l'indiquer également, pour servir de référence aux autres utilisateurs.
      placeholder: "par ex. : deepseek/deepseek-chat, openai/gpt-4o, gemini/gemini-2.5-flash"
    validations:
      required: false

  - type: textarea
    id: share-content
    attributes:
      label: 📄 Description du contenu
      placeholder: |
        - En cas de partage : collez votre bloc de code de prompt et décrivez brièvement son style d'analyse.
        - En cas de demande d'aide : collez votre extrait de configuration (en masquant la clé) et le comportement rencontré.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 📷 Captures d'écran du résultat (recommandé)
      description: |
        ⚠️ **Important** : veuillez fournir une **capture d'écran complète**, ne capturez pas seulement une partie !
        - Lors d'un partage : montrez le résultat complet de l'analyse IA
        - Lors d'une demande d'aide : montrez le message d'erreur complet ou le comportement anormal

        Les captures partielles manquent souvent d'informations clés, ce qui rend le diagnostic difficile.
      placeholder: Glissez-déposez ici la capture du résultat d'analyse ou de la configuration, en veillant à ce qu'elle soit complète.
    validations:
      required: false
