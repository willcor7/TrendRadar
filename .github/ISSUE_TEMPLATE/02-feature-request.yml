# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json

name: 💡 J'ai une idée
description: Suggérer une nouvelle fonctionnalité, une amélioration du style des notifications ou de l'expérience
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💝 N'hésitez pas à partager vos idées
        Vos bonnes idées peuvent rendre TrendRadar encore meilleur !

        Pour l'instant, l'attention se porte principalement sur les axes d'amélioration suivants :
        - ✨ **Capacités d'analyse IA** : interprétation plus intelligente, dimensions d'analyse plus riches
        - 🎨 **Expérience de notification** : mise en page plus soignée, présentation de l'information plus pertinente
        - 🛠️ **Optimisation de la facilité d'usage** : configuration plus simple, exécution plus stable

        *Note : pour le moment, les demandes d'intégration de nouvelles plateformes de collecte ne sont pas acceptées, merci de votre compréhension.*

  - type: textarea
    id: feature-description
    attributes:
      label: 💭 Quelle est votre idée ?
      placeholder: |
        Veuillez décrire brièvement :
        - Quelle fonctionnalité souhaiteriez-vous ajouter ?
        - Quel problème permet-elle de résoudre ?
        - Si vous avez une image ou un outil de référence, n'hésitez pas à joindre une capture d'écran.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: 🎯 Cas d'usage (facultatif)
      placeholder: "Par exemple : quand je suis en train de..., ce serait génial de pouvoir..."
    validations:
      required: false
